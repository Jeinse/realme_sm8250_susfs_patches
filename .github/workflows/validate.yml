name: Validate source tools (no kernel compilation)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python unit tests and payload consistency
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/sync_jack.py verify-repository
